      <h1>원스토어 결제 테스트</h1>
      <p class="notice">결제창과 응답을 확인하는 화면입니다. 보석·상품은 지급하지 않으며 구매 소비·확인 처리를 하지 않습니다.</p>

      <button id="reload-products" disabled>상품 다시 조회</button>
      <div id="products"></div>
      <p>성공 응답 후 원콘솔의 Sandbox 결제 내역에서 확인하고 취소해 주세요. 소비하지 않은 상품의 재구매는 <code>already_owned</code>로 거절될 수 있습니다.</p>
