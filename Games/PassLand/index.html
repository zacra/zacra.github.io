<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>패스랜드</title>
    <link rel="icon" type="image/png" href="./assets/img/game_icon.png" />
    <style>
      @font-face {
        font-family: 'PasslandJua';
        src: url('./assets/fonts/BMJUA_ttf.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a1a22;
        font-family: 'PasslandJua', sans-serif;
      }
      #game-container {
        width: 100%;
        height: 100%;
        /* Phaser Scale.CENTER_BOTH 가 canvas margin 으로 중앙 맞춤.
           여기서 flex center 를 쓰면 margin 과 이중 적용되어 오른쪽으로 밀림. */
        position: relative;
      }
      #game-container canvas {
        display: block;
      }
    </style>
    <style>
      body { display: flex; flex-direction: column; height: 100dvh; }
      #game-container { flex: 1; min-height: 0; height: auto; }
      #banner-shell { display: none; flex: none; background: white; padding-bottom: env(safe-area-inset-bottom, 0px); }
      .has-banner #banner-shell { display: block; }
      #toss-banner { min-height: 60px; width: 100%; }
      .ad-offer { position: fixed; inset: 0; z-index: 20000; background: #0009; display: grid; place-items: center; padding: 20px; }
      .ad-offer-panel { width: min(350px, 100%); padding: 24px; border-radius: 20px; background: #fff8ee; color: #5a3f2f; text-align: center; }
      .ad-offer-panel p { margin: 16px 0; line-height: 1.5; }
      .ad-offer-panel button { display: block; width: 100%; padding: 14px; margin-top: 10px; border: 0; border-radius: 12px; background: #c05a43; color: white; font: inherit; font-size: 18px; }
      .ad-offer-panel button:disabled { opacity: .5; }
    </style>
    <script type="module" crossorigin src="./assets/index-BRsMaFeJ.js"></script>
  </head>
  <body>
    <div id="game-container"></div>
    <div id="banner-shell"><div id="toss-banner"></div></div>
  </body>
</html>
